[project]
name = "ai-career-anxiety-system"
version = "3.0.0"
description = "AI-Induced Career Anxiety Prediction System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "shap>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn>=0.30.0",
    "streamlit>=1.25.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.4.0",
]

[tool.vercel]
entrypoint = "api.index:app"
